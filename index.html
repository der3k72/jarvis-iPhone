
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>JARVIS AI</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  min-height:100dvh;
  background:#020b16;
  color:#8eeaff;
  font-family:Arial,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}
h1 {
  font-size:30px;
  letter-spacing:7px;
  text-shadow:0 0 20px #00cfff;
}
.reactor {
  position:relative;
  width:240px;
  height:240px;
  margin:25px auto;
  display:grid;
  place-items:center;
}
.ring {
  position:absolute;
  border-radius:50%;
  border:3px dashed #00d9ff;
  box-shadow:0 0 20px #009ac9;
}
.outer {
  width:240px;
  height:240px;
  animation:spin 14s linear infinite;
}
.middle {
  width:190px;
  height:190px;
  border-style:dotted;
  animation:spin 9s linear infinite reverse;
}
.inner {
  width:145px;
  height:145px;
  border-style:solid;
  box-shadow:0 0 35px #00d9ff;
}
.core {
  font-size:17px;
  font-weight:bold;
  letter-spacing:2px;
  text-shadow:0 0 12px #00d9ff;
}
@keyframes spin {
  to { transform:rotate(360deg); }
}
#clock {
  font-size:26px;
  margin:15px;
}
#status {
  font-size:13px;
  letter-spacing:3px;
  margin-bottom:20px;
}
button {
  width:230px;
  padding:15px;
  margin:8px;
  border:1px solid #00d9ff;
  border-radius:10px;
  background:#052c44;
  color:#a7efff;
  font-size:15px;
}
</style>
</head>
<body>
<h1>J.A.R.V.I.S.</h1>
<div class="reactor">
  <div class="ring outer"></div>
  <div class="ring middle"></div>
  <div class="ring inner"></div>
  <div class="core">AI ONLINE</div>
</div>
<div id="clock"></div>
<div id="status">SYSTEMS READY</div>
<button onclick="greet()">SPEAK STATUS</button>
<button onclick="activate()">ACTIVATE JARVIS</button>
<script>
function updateClock() {
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString();
}
setInterval(updateClock,1000);
updateClock();

function greet() {
  const msg = new SpeechSynthesisUtterance(
    "JARVIS online. All systems operational. " +
    "How may I assist you, sir?"
  );
  msg.lang="en-US";
  speechSynthesis.cancel();
  speechSynthesis.speak(msg);
}

function activate() {
  window.location.href =
    "shortcuts://run-shortcut?name=Jarvis";
}
</script>
</body>
</html>
